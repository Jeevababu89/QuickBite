
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite - Food Ordering</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf3;
      color: #292929;
    }
    header {
      background: #ff5722;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }
    header h1 { margin: 0; font-size: 25px; }
    #cart-count {
      background: white;
      color: #ff5722;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: bold;
    }
    .hero {
      padding: 38px 18px;
      text-align: center;
      background: #ffe1cf;
    }
    .hero h2 { font-size: 32px; margin: 0 0 10px; }
    .hero p { color: #555; }
    .hero a {
      display: inline-block;
      background: #ff5722;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    main { padding: 20px 14px; max-width: 1000px; margin: auto; }
    h2.section-title { text-align: center; }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 15px;
    }
    .food {
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 3px 12px #00000012;
    }
    .food .emoji { font-size: 60px; }
    .food h3 { margin: 8px 0; }
    .price { color: #e64a19; font-weight: bold; font-size: 18px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .add, .checkout {
      background: #ff5722;
      color: white;
      width: 100%;
      margin-top: 8px;
    }
    .cart-box {
      margin-top: 28px;
      padding: 18px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 12px #00000012;
    }
    .cart-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }
    .qty button { background: #ffe1cf; }
    .total { font-size: 21px; font-weight: bold; text-align: right; }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }
    footer {
      text-align: center;
      padding: 22px;
      background: #292929;
      color: white;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<header>
  <h1>🍔 QuickBite</h1>
  <span id="cart-count">🛒 0</span>
</header>

<section class="hero">
  <h2>Hungry? Let's eat!</h2>
  <p>Fresh, tasty food delivered to your doorstep.</p>
  <a href="#menu">Order Now 🍕</a>
</section>

<main>
  <h2 class="section-title" id="menu">Our Popular Menu</h2>
  <div class="menu" id="food-menu"></div>

  <section class="cart-box" id="cart">
    <h2>🛒 Your Cart</h2>
    <div id="cart-items">Your cart is empty.</div>
    <p class="total">Total: ₹<span id="total">0</span></p>

    <h3>Delivery Details</h3>
    <form id="order-form">
      <label for="customer">Your name</label>
      <input id="customer" required placeholder="Enter your name">

      <label for="phone">Phone number</label>
      <input id="phone" type="tel" required
        pattern="[0-9]{10}" maxlength="10"
        placeholder="10-digit mobile number">

      <label for="address">Delivery address</label>
      <textarea id="address" required
        placeholder="Enter your full address"></textarea>

      <button class="checkout" type="submit">
        Place Order
      </button>
    </form>
    <p id="message" role="status"></p>
  </section>
</main>

<footer>
  <p>© 2026 QuickBite | Made with ❤️ for food lovers</p>
</footer>

<script>
  const foods = [
    { id: 1, name: "Cheese Pizza", price: 199, emoji: "🍕" },
    { id: 2, name: "Classic Burger", price: 129, emoji: "🍔" },
    { id: 3, name: "French Fries", price: 79, emoji: "🍟" },
    { id: 4, name: "Sandwich", price: 99, emoji: "🥪" },
    { id: 5, name: "Biryani", price: 179, emoji: "🍛" },
    { id: 6, name: "Ice Cream", price: 69, emoji: "🍨" },
    { id: 7, name: "Cold Coffee", price: 89, emoji: "🥤" },
    { id: 8, name: "Cake", price: 99, emoji: "🍰" }
  ];

  const cart = {};

  function renderMenu() {
    document.getElementById("food-menu").innerHTML =
      foods.map(food => `
        <article class="food">
          <div class="emoji">${food.emoji}</div>
          <h3>${food.name}</h3>
          <p class="price">₹${food.price}</p>
          <button class="add" onclick="changeQty(${food.id}, 1)">
            Add to Cart
          </button>
        </article>
      `).join("");
  }

  function changeQty(id, amount) {
    cart[id] = (cart[id] || 0) + amount;
    if (cart[id] <= 0) delete cart[id];
    renderCart();
  }

  function renderCart() {
    const entries = foods.filter(food => cart[food.id]);
    const count = Object.values(cart).reduce((a, b) => a + b, 0);
    const total = entries.reduce(
      (sum, food) => sum + food.price * cart[food.id], 0
    );

    document.getElementById("cart-count").textContent = "🛒 " + count;
    document.getElementById("total").textContent = total;

    document.getElementById("cart-items").innerHTML =
      entries.length ? entries.map(food => `
        <div class="cart-row">
          <span>${food.emoji} ${food.name}<br>₹${food.price} each</span>
          <span class="qty">
            <button type="button" onclick="changeQty(${food.id}, -1)">−</button>
            ${cart[food.id]}
            <button type="button" onclick="changeQty(${food.id}, 1)">+</button>
          </span>
        </div>
      `).join("") : "Your cart is empty.";
  }

  document.getElementById("order-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const entries = foods.filter(food => cart[food.id]);
    if (!entries.length) {
      document.getElementById("message").textContent =
        "Please add food to your cart first.";
      return;
    }

    const name = document.getElementById("customer").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const total = entries.reduce(
      (sum, food) => sum + food.price * cart[food.id], 0
    );

    const order = entries.map(food =>
      `${food.name} x ${cart[food.id]}`
    ).join(", ");

    const text = `Hello QuickBite! I want to place an order:\n${order}\nTotal: ₹${total}\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;

    document.getElementById("message").textContent =
      "Your order summary is ready. Choose how to send it next.";

    const oldButton = document.getElementById("send-order");
    if (oldButton) oldButton.remove();

    const button = document.createElement("button");
    button.id = "send-order";
    button.className = "checkout";
    button.type = "button";
    button.textContent = "Copy Order Details";
    button.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById("message").textContent =
          "Order details copied. No order has been sent to a restaurant yet.";
      } catch {
        document.getElementById("message").textContent =
          text;
      }
    };
    document.getElementById("message").after(button);
  });

  renderMenu();
  renderCart();
</script>

</body>
</html>
